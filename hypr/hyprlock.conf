general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = ~/.config/hypr/lockscreen.jpg
    blur_passes = 3
    blur_size = 5
    brightness = 0.4
    contrast = 0.85
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(235, 219, 178, 1.0)
    font_size = 170
    font_family = JetBrainsMono Nerd Font Bold
    halign = center
    valign = center
    position = 0, 130
    shadow_passes = 5
    shadow_size = 10
    shadow_color = rgba(0, 0, 0, 0.7)
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(215, 153, 33, 1.0)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    halign = center
    valign = center
    position = 0, 0
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.7)
}

shape {
    monitor =
    size = 280, 2
    color = rgba(60, 56, 54, 1.0)
    rounding = 0
    border_size = 0
    halign = center
    valign = center
    position = 0, -70
}

label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/player.sh
    color = rgba(131, 165, 152, 1.0)
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    halign = center
    valign = center
    position = 0, -120
    shadow_passes = 3
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.7)
}

input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.32
    dots_center = true
    dots_rounding = -2
    outer_color = rgba(215, 153, 33, 1.0)
    inner_color = rgba(40, 40, 40, 0.95)
    font_color = rgba(235, 219, 178, 1.0)
    fade_on_empty = false
    rounding = 0
    check_color = rgba(184, 187, 38, 1.0)
    fail_color = rgba(251, 73, 52, 1.0)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgba(254, 128, 25, 1.0)
    placeholder_text = <span foreground="##928374">enter password</span>
    hide_input = false
    halign = center
    valign = center
    position = 0, -240
    shadow_passes = 4
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.7)
}
